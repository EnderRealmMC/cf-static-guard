  <main class="prose">
    <h1>接入自己的静态站</h1>
    <ol>
      <li>把构建产物同步到 <code>packages/guard-worker/assets/site/</code></li>
      <li>多页站保持 <code>SPA_FALLBACK=false</code>；前端路由 SPA 设为 <code>true</code></li>
      <li>配置 GitHub OAuth App 与 Secrets，部署 Worker</li>
    </ol>
    <p>当前页面的 CSS 与图标同样需要登录后才能加载。</p>
  </main>
